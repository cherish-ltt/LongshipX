name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.rs"
      - "**.proto"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".rustfmt.toml"
      - ".clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "**.rs"
      - "**.proto"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".rustfmt.toml"
      - ".clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-ci.yml"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Show rustup info
        run: rustup show

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lints)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the project
        run: cargo build --workspace --all-targets --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      - name: Bounded transport stress and delay comparison
        run: cargo test -p longshipx-gateway --test e2e kcp_stress:: --locked -- --ignored --test-threads=1 --nocapture

      - name: Quickstart client process smoke
        run: LONGSHIPX_QUICKSTART_CLIENT_BIN="$PWD/target/debug/examples/quickstart_client" cargo test -p longshipx-gateway --test e2e quickstart_client_process --locked -- --ignored --nocapture
