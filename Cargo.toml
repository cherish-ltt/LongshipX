[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/net-kit",
    "crates/protocol",
    "crates/infrastructure",
    "crates/gateway",
    "crates/server-bin",
    "migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

# ─────────────────────────────────────────────────────────────
# 依赖统一管理:所有第三方依赖在此以 "=" 锁定版本并按用途分组;
# 子 crate 通过 `dep = { workspace = true }` 引用。
# 仅当各 crate 需要的 feature 不同(如 tokio)时,才在子 crate 内
# 追加 `features = [...]`(与 workspace 声明叠加,增量生效)。
# ─────────────────────────────────────────────────────────────
[workspace.dependencies]

# ── workspace 内部 crate(路径 + 版本)──
longshipx-domain = { path = "crates/domain", version = "=0.1.0" }
longshipx-application = { path = "crates/application", version = "=0.1.0" }
longshipx-net-kit = { path = "crates/net-kit", version = "=0.1.0" }
longshipx-protocol = { path = "crates/protocol", version = "=0.1.0" }
longshipx-infrastructure = { path = "crates/infrastructure", version = "=0.1.0" }
longshipx-gateway = { path = "crates/gateway", version = "=0.1.0" }
longshipx-migration = { path = "migration", version = "=0.1.0" }

# ── 异步运行时与网络 ──
tokio = "=1.53.1"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
socket2 = "=0.6.5"
axum = "=0.8.9"
# HTTP 入口 TLS 终结(提供者由我们的 ServerConfig 指定为 ring)
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }

# ── 协议(构建期由 protox 编译,无需 protoc)──
prost = "=0.14.4"
prost-build = "=0.14.4"
protox = "=0.9.1"

# ── 存储与缓存 ──
sea-orm = { version = "=2.0.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
sea-orm-migration = { version = "=2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
redis = { version = "=1.6.0", features = ["tokio-comp"] }

# ── 安全 ──
argon2 = { version = "=0.6.0", features = ["password-hash", "alloc"] }
getrandom = "=0.4.3"

# ── 基础库 ──
uuid = { version = "=1.26.0", features = ["v7", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.20"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "=0.1.92"
parking_lot = "=0.12.5"
dotenvy = "=0.15.7"

# ── 可观测性 ──
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"

# ── 测试专用 ──
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.3"
rcgen = "=0.14.10"
