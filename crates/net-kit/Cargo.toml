[package]
name = "longshipx-net-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "通用网络框架:TCP+TLS 传输、长度前缀帧编解码、读写分离与有界背压(零业务依赖)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 异步运行时与网络 IO
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
# TLS 1.3(rustls 纯 Rust 实现,PRD 第 3 章)
tokio-rustls = { workspace = true }
rustls = { workspace = true }
# TCP backlog / keepalive 细粒度控制
socket2 = { workspace = true }
# 异步 trait(Transport)
async-trait = { workspace = true }
# 错误定义与日志
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 异步单测
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# 测试用自签证书生成
rcgen = { workspace = true }
