[package]
name = "longshipx-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "接口层:TCP+TLS 长连接入口、HTTP(axum)入口、鉴权/限流中间件与消息路由装配"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 入站适配依赖:网络框架 + 协议 + 应用层(PRD 4.2,不直接调用 domain 业务逻辑)
longshipx-net-kit = { workspace = true }
longshipx-protocol = { workspace = true }
longshipx-application = { workspace = true }
longshipx-domain = { workspace = true }
# 异步运行时
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
# HTTP 入口(PRD 8.3:登录/注册等低频操作)
axum = { workspace = true }
# HTTP 入口 TLS 终结(复用 net-kit 的 rustls 配置,强制 HTTPS)
axum-server = { workspace = true }
rustls = { workspace = true }
# HTTP DTO 序列化与时间戳
serde = { workspace = true }
chrono = { workspace = true }
# 连接 ID
uuid = { workspace = true }
# 共享状态(不中毒的 Mutex,PRD 9.3)
parking_lot = { workspace = true }
# 错误定义
thiserror = { workspace = true }
# 指标(PRD 第 12 章)与日志
metrics = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 路由层单测(oneshot 请求)
tower = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
# 测试中实现端口 trait
async-trait = { workspace = true }
# 端到端 TLS 测试:自签证书与客户端连接
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# 端到端测试用内存版基础设施(仅测试依赖,不进入生产装配)
longshipx-infrastructure = { workspace = true }
