[package]
name = "longshipx-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "游戏消息协议:protobuf 定义、prost 生成、帧编解码适配与消息路由表"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# protobuf 运行时(PRD 8.2:跨语言序列化方案)
prost = { workspace = true }
# 帧与 Codec trait 定义
longshipx-net-kit = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
# prost 代码生成
prost-build = { workspace = true }
# 纯 Rust protobuf 编译器(无需系统 protoc,CI 友好)
protox = { workspace = true }

[dev-dependencies]
# 路由器异步单测
tokio = { workspace = true, features = ["macros", "rt"] }
