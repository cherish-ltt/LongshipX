[package]
name = "longshipx-domain"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "领域层:业务实体、值对象、聚合根、领域事件与仓储接口(零技术栈依赖)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 标识与时间
uuid = { workspace = true }
chrono = { workspace = true }
# 错误定义
thiserror = { workspace = true }
# 异步仓储接口(PRD 5.2)
async-trait = { workspace = true }
# 序列化标记(仅 derive,禁止引入任何技术栈)
serde = { workspace = true }
