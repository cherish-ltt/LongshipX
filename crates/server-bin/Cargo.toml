[package]
name = "longshipx-server-bin"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "组装根:依赖注入、配置加载、TLS 监听启动与优雅停机(唯一可执行文件)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ghyper9023/ppt-tcp"

[[bin]]
name = "longshipx-server"
path = "src/main.rs"

[dependencies]
# 组装全部分层(PRD 4.2 composition root)
longshipx-domain = { path = "../domain", version = "=0.1.0" }
longshipx-application = { path = "../application", version = "=0.1.0" }
longshipx-net-kit = { path = "../net-kit", version = "=0.1.0" }
longshipx-protocol = { path = "../protocol", version = "=0.1.0" }
longshipx-infrastructure = { path = "../infrastructure", version = "=0.1.0" }
longshipx-gateway = { path = "../gateway", version = "=0.1.0" }
longshipx-migration = { path = "../../migration", version = "=0.1.0" }
# 异步运行时(多线程,PRD 9.4)
tokio = { version = "=1.53.1", features = ["full"] }
# 数据库连接池参数构造(与 infrastructure 同版本)
sea-orm = { version = "=2.0.2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
# HTTP 网关与 /metrics 端点复用同一套 axum 栈
axum = "=0.8.9"
# 结构化日志(PRD 第 12 章)
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
# Prometheus 指标导出
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"
# .env 加载(PRD 18.3)
dotenvy = "=0.15.7"

[dev-dependencies]
# quickstart_client 示例:TLS 客户端(与 net-kit 同版本)
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
