[package]
name = "longshipx-server-bin"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "组装根:依赖注入、配置加载、TLS 监听启动与优雅停机(唯一可执行文件)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[[bin]]
name = "longshipx-server"
path = "src/main.rs"

[dependencies]
# 组装全部分层(PRD 4.2 composition root)
longshipx-domain = { workspace = true }
longshipx-application = { workspace = true }
longshipx-net-kit = { workspace = true }
longshipx-protocol = { workspace = true }
longshipx-infrastructure = { workspace = true }
longshipx-gateway = { workspace = true }
longshipx-migration = { workspace = true }
# 异步运行时(多线程,PRD 9.4)
tokio = { workspace = true, features = ["full"] }
# HTTP 网关与 /metrics 端点复用同一套 axum 栈
axum = { workspace = true }
# TLS 配置类型(TCP/HTTP 双入口共用同一份 rustls 配置)
rustls = { workspace = true }
# 数据库连接池参数构造(与 infrastructure 同版本)
sea-orm = { workspace = true }
# 结构化日志(PRD 第 12 章)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Prometheus 指标导出
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# .env 加载(PRD 18.3)
dotenvy = { workspace = true }

[dev-dependencies]
# quickstart_client 示例:TLS 客户端(与 net-kit 同版本)
rustls = { workspace = true }
tokio-rustls = { workspace = true }
