[package]
name = "longshipx-application"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "应用层:用例编排(Command/Query)、端口 trait、事务边界抽象与 Room Actor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 领域层(依赖方向只指向内层,PRD 4.1)
longshipx-domain = { workspace = true }
# 异步端口 trait
async-trait = { workspace = true }
# 错误定义
thiserror = { workspace = true }
# 时间与标识
chrono = { workspace = true }
uuid = { workspace = true }
# Room Actor / 端口使用的异步原语
tokio = { workspace = true, features = ["sync", "rt"] }
# 用例内结构化日志
tracing = { workspace = true }

[dev-dependencies]
# 异步单测(含超时等待)
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
