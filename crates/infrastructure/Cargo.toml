[package]
name = "longshipx-infrastructure"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "基础设施层:SeaORM 仓储实现、Redis token 存储、argon2id 密码哈希与环境变量配置"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 内层 crate(实现其定义的 trait,依赖倒置)
longshipx-domain = { path = "../domain", version = "=0.1.0" }
longshipx-application = { path = "../application", version = "=0.1.0" }
# PostgreSQL + SeaORM 2.0 稳定版(PRD 7.2 二编:2.0 已 GA,优先使用)
sea-orm = { version = "=2.0.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
# Redis 客户端(PRD 7.5:官方 redis-rs + MultiplexedConnection)
redis = { version = "=1.6.0", features = ["tokio-comp"] }
# argon2id 密码哈希(PRD 第 10 章)
argon2 = { version = "=0.6.0", features = ["password-hash", "alloc"] }
# 异步端口实现
async-trait = "=0.1.92"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["v7"] }
chrono = { version = "=0.4.45", features = ["serde"] }
# audit_logs.detail JSONB 列
serde_json = "=1.0.151"
# token 随机数(密码学安全)
getrandom = "=0.4.3"
# 进程内事件分发与内存存储
tokio = { version = "=1.53.1", features = ["sync"] }
tracing = "=0.1.44"

[dev-dependencies]
# 异步单测(含暂停时钟的过期测试)
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
