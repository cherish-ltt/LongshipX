[package]
name = "longshipx-infrastructure"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["The LongshipX Contributors"]
description = "基础设施层:SeaORM 仓储实现、Redis token 存储、argon2id 密码哈希与环境变量配置"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cherish-ltt/LongshipX"

[dependencies]
# 内层 crate(实现其定义的 trait,依赖倒置)
longshipx-domain = { workspace = true }
longshipx-application = { workspace = true }
# PostgreSQL + SeaORM 2.0 稳定版(PRD 7.2 二编:2.0 已 GA,优先使用)
sea-orm = { workspace = true }
# Redis 客户端(PRD 7.5:官方 redis-rs + MultiplexedConnection)
redis = { workspace = true }
# argon2id 密码哈希(PRD 第 10 章)
argon2 = { workspace = true }
# token 随机数(密码学安全)
getrandom = { workspace = true }
# 异步端口实现与错误定义
async-trait = { workspace = true }
thiserror = { workspace = true }
# 标识与时间
uuid = { workspace = true }
chrono = { workspace = true }
# audit_logs.detail JSONB 列
serde_json = { workspace = true }
# 进程内事件分发与内存存储
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
# 异步单测(含暂停时钟的过期测试)
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
